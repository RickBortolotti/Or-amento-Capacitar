<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de Orçamento — Capacitar</title>

  <!-- Define window.__resources com URLs das imagens das parcerias -->
  <script src="./resources.js"></script>

  <!-- React e dc-runtime carregam em ordem -->
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>

  <!-- Pre-fix: intercepta fetch() para o caso do runtime tentar buscar arquivos
       .dc.html ou re-ler a propria pagina (comportamento de HTTP, nao usado aqui) -->
  <script src="./assets/js/fetch-shim.js"></script>

  <!-- Runtime do framework -->
  <script src="./vendor/dc-runtime.js"></script>

  <!-- Estilos das fontes (Barlow, Barlow Condensed, Spline Sans Mono) -->
  <link rel="stylesheet" href="./assets/css/fonts.css">
  <!-- Estilos basicos do app -->
  <link rel="stylesheet" href="./assets/css/styles.css">
  <!-- Adaptacao para mobile -->
  <link rel="stylesheet" href="./assets/css/responsive.css">
</head>
<body>

<!-- =========================================================
     Template do componente raiz.
     Mantemos dentro de um <template> ate o runtime estar pronto:
     isso impede o navegador de tentar baixar imagens cujo src ainda
     contem placeholders nao-interpolados (ex.: src="{{ p.img }}")
     e tambem suprime warnings de "value '{{ ... }}' is not a valid number".
     ========================================================= -->
<template id="dc-template">
<div class="app" style="display:flex;height:100vh;width:100%;font-family:'Barlow',sans-serif;background:#0f1011">

  <!-- ============ EDITOR / FORM (somente tela) ============ -->
  <div class="editor" style="width:392px;flex:none;background:#1b1c1e;color:#fff;display:flex;flex-direction:column;height:100vh;border-right:1px solid #2a2c2e">
    <div style="padding:22px 24px;border-bottom:1px solid #2a2c2e;display:flex;align-items:center;gap:13px">
      <div style="background:#fff;border-radius:5px;padding:7px 9px;display:flex"><img src="./assets/img/ea86ac24.png" alt="CAPACITAR" style="width:104px;height:auto;display:block"></div>
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.02em;line-height:1">GERAR ORÇAMENTO</div>
        <div style="font-size:11.5px;color:#8a8d90;margin-top:2px">Preencha e clique em Gerar PDF</div>
      </div>
    </div>

    <div class="editor-body" style="flex:1;overflow-y:auto;padding:22px 24px 28px">

      <!-- Cliente -->
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;color:#dd2a1b;margin-bottom:9px">CLIENTE</div>
      <input value="{{ clienteNome }}" onchange="{{ onCliente }}" placeholder="Nome do cliente" style="width:100%;background:#26282b;border:1px solid #3a3d40;border-radius:6px;color:#fff;font-family:'Barlow',sans-serif;font-size:14px;padding:10px 12px;outline:none" style-focus="border-color:#dd2a1b">

      <div style="margin-top:11px;display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8a8d90;flex-wrap:wrap">
        <span style="font-family:'Spline Sans Mono',monospace;color:#cfd1d4;background:#26282b;border:1px solid #3a3d40;border-radius:5px;padding:4px 8px">{{ dataCurta }}</span>
        <span>data automática (hoje) · responsável fixo: Renato</span>
      </div>

      <!-- Itens -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin:26px 0 11px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;color:#dd2a1b">ITENS / CURSOS</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <sc-for list="{{ itensForm }}" as="item" hint-placeholder-count="1">
          <div style="background:#232527;border:1px solid #2f3134;border-radius:9px;padding:13px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
              <span style="font-family:'Spline Sans Mono',monospace;font-size:11px;color:#8a8d90">ITEM {{ item.num }}</span>
              <button onclick="{{ item.onRemove }}" style="background:none;border:none;color:#8a8d90;font-size:18px;line-height:1;cursor:pointer;padding:0 4px" style-hover="color:#dd2a1b" title="Remover item">×</button>
            </div>
            <input value="{{ item.descricao }}" onchange="{{ item.onDesc }}" placeholder="Descrição do serviço / curso" style="width:100%;background:#1b1c1e;border:1px solid #3a3d40;border-radius:6px;color:#fff;font-family:'Barlow',sans-serif;font-size:13.5px;padding:9px 11px;outline:none;text-transform:uppercase" style-focus="border-color:#dd2a1b">
            <div style="display:flex;gap:10px;margin-top:9px">
              <div style="width:74px">
                <div style="font-size:10px;letter-spacing:.1em;color:#8a8d90;margin-bottom:4px">QTD</div>
                <input type="number" min="1" step="1" value="{{ item.qtd }}" onchange="{{ item.onQtd }}" style="width:100%;background:#1b1c1e;border:1px solid #3a3d40;border-radius:6px;color:#fff;font-family:'Spline Sans Mono',monospace;font-size:13px;padding:8px 10px;outline:none" style-focus="border-color:#dd2a1b">
              </div>
              <div style="flex:1">
                <div style="font-size:10px;letter-spacing:.1em;color:#8a8d90;margin-bottom:4px">VALOR UNITÁRIO (R$)</div>
                <input type="number" min="0" step="0.01" value="{{ item.unitario }}" onchange="{{ item.onUnit }}" placeholder="0,00" style="width:100%;background:#1b1c1e;border:1px solid #3a3d40;border-radius:6px;color:#fff;font-family:'Spline Sans Mono',monospace;font-size:13px;padding:8px 10px;outline:none" style-focus="border-color:#dd2a1b">
              </div>
              <div style="width:96px">
                <div style="font-size:10px;letter-spacing:.1em;color:#8a8d90;margin-bottom:4px">SUBTOTAL</div>
                <div style="font-family:'Spline Sans Mono',monospace;font-size:13px;padding:8px 0;color:#cfd1d4">R$ {{ item.subFmt }}</div>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
      <button onclick="{{ addItem }}" style="width:100%;margin-top:12px;background:#232527;border:1px dashed #3f4245;border-radius:8px;color:#cfd1d4;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.08em;padding:11px;cursor:pointer" style-hover="border-color:#dd2a1b;color:#fff">+ ADICIONAR ITEM</button>

      <!-- Total -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:13px 15px;background:#232527;border-radius:8px">
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;color:#8a8d90">TOTAL</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px"><span style="color:#dd2a1b">R$</span> {{ totalFmt }}</span>
      </div>

      <div style="margin-top:24px;font-size:11px;color:#6c6f72;line-height:1.55">A seção <strong style="color:#9a9da0">Certificação &amp; Diferenciais</strong>, o contato/CNPJ, o responsável (Renato) e as parcerias já vêm fixos no documento. Quer mudar algum texto? É só me pedir.</div>
    </div>

    <div style="padding:16px 24px;border-top:1px solid #2a2c2e;background:#161718">
      <button onclick="{{ gerarPDF }}" style="width:100%;background:#dd2a1b;border:none;border-radius:9px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.1em;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px" style-hover="background:#c11f10">GERAR PDF</button>
      <div style="text-align:center;font-size:10.5px;color:#6c6f72;margin-top:8px">Na janela de impressão, escolha <strong style="color:#9a9da0">Salvar como PDF</strong></div>
    </div>
  </div>

  <!-- ============ STAGE / PREVIEW A4 ============ -->
  <div class="stage" style="flex:1;background:#e8e7e4;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:36px">
    <div class="page" data-screen-label="Orçamento" style="width:794px;flex:none;background:#fff;color:#141515;position:relative;overflow:hidden;box-shadow:0 30px 70px -24px rgba(0,0,0,.4)">
      <div style="display:flex;min-height:1123px">
        <div style="width:236px;background:#141515;color:#fff;display:flex;flex-direction:column;flex:none">
          <div style="height:7px;background:repeating-linear-gradient(135deg,#141515 0 12px,#dd2a1b 12px 24px)"></div>
          <div style="padding:24px 22px;border-bottom:1px solid #2a2c2e">
            <div style="background:#fff;border-radius:4px;padding:14px;display:flex;justify-content:center">
              <img src="./assets/img/ea86ac24.png" alt="CAPACITAR" style="width:162px;height:auto;display:block">
            </div>
          </div>
          <div style="padding:24px 22px;font-size:11.5px;color:#9a9da0;line-height:1.7">
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;color:#dd2a1b;margin-bottom:11px">CONTATO</div>
            Rua Heitor Liberato, nº 687<br>Centro — Itajaí / SC<br><br>Fone (47) 99999-7674<br>CNPJ 55.596.172/0001-61
          </div>
          <div style="margin-top:auto;padding:22px;border-top:1px solid #2a2c2e">
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;color:#9a9da0;margin-bottom:12px">PARCERIAS</div>
            <sc-for list="{{ parcerias }}" as="p" hint-placeholder-count="2">
              <div style="background:#fff;border-radius:4px;padding:9px 12px;display:flex;justify-content:center;align-items:center;height:30px;margin-bottom:8px"><img src="{{ p.img }}" alt="{{ p.nome }}" style="max-height:24px;max-width:170px;width:auto;height:auto"></div>
            </sc-for>
          </div>
        </div>
        <div style="flex:1;padding:40px 42px;display:flex;flex-direction:column">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #141515;padding-bottom:16px">
            <div>
              <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:35px;letter-spacing:.03em;line-height:1">ORÇAMENTO</div>
              <div style="height:3px;width:66px;background:#dd2a1b;margin-top:7px"></div>
            </div>
            <div style="text-align:right;font-family:'Spline Sans Mono',monospace;font-size:12px;color:#56595d;line-height:1.7"><div>{{ dataCurta }}</div></div>
          </div>
          <div style="margin-top:24px">
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;color:#dd2a1b">PARA / CLIENTE</div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:27px;margin-top:3px">{{ clienteNomePreview }}</div>
          </div>
          <p style="margin:22px 0 13px;font-size:13.5px;color:#3a3d40;line-height:1.5">Venho por meio desta apresentar o orçamento referente ao(s) serviço(s) abaixo:</p>
          <div>
            <div style="display:grid;grid-template-columns:40px 1fr 54px 110px 110px;background:#f3f1ee;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.07em;color:#56595d;border-bottom:2px solid #dd2a1b">
              <div style="padding:10px 12px">#</div>
              <div style="padding:10px 12px">DESCRIÇÃO</div>
              <div style="padding:10px 12px;text-align:center">QTD</div>
              <div style="padding:10px 12px;text-align:right">UNIT.</div>
              <div style="padding:10px 12px;text-align:right">TOTAL</div>
            </div>
            <sc-for list="{{ itens }}" as="item" hint-placeholder-count="1">
              <div style="display:grid;grid-template-columns:40px 1fr 54px 110px 110px;border-bottom:1px solid #ece9e5;font-size:13px">
                <div style="padding:13px 12px;font-family:'Spline Sans Mono',monospace;color:#9a9da0">{{ item.num }}</div>
                <div style="padding:13px 12px;font-weight:500;text-transform:uppercase">{{ item.descricao }}</div>
                <div style="padding:13px 12px;text-align:center;font-family:'Spline Sans Mono',monospace">{{ item.qtd }}</div>
                <div style="padding:13px 12px;text-align:right;font-family:'Spline Sans Mono',monospace">R$ {{ item.unitFmt }}</div>
                <div style="padding:13px 12px;text-align:right;font-family:'Spline Sans Mono',monospace;font-weight:600">R$ {{ item.totalFmt }}</div>
              </div>
            </sc-for>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:16px">
            <div style="display:flex;align-items:baseline;gap:16px;border-top:2px solid #141515;padding-top:12px">
              <span style="font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.14em;font-size:14px;color:#56595d">TOTAL</span>
              <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:31px;white-space:nowrap"><span style="color:#dd2a1b">R$</span> {{ totalFmt }}</span>
            </div>
          </div>
          <div style="margin-top:30px">
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.08em;display:flex;align-items:center;gap:9px"><span style="width:9px;height:9px;background:#dd2a1b"></span>CERTIFICAÇÃO &amp; DIFERENCIAIS</div>
            <div style="margin-top:13px;display:flex;flex-direction:column;gap:10px">
              <sc-for list="{{ diferenciais }}" as="d" hint-placeholder-count="3">
                <div style="display:flex;gap:11px;align-items:flex-start;font-size:12.5px;color:#3a3d40;line-height:1.5"><span style="margin-top:6px;width:6px;height:6px;background:#141515;flex:none;transform:rotate(45deg)"></span><span>{{ d }}</span></div>
              </sc-for>
            </div>
          </div>
          <div style="margin-top:auto;padding-top:38px;display:flex;justify-content:space-between;align-items:flex-end">
            <div style="font-size:13px;color:#3a3d40;line-height:1.6">Sem mais para o momento,<br>Atenciosamente,<br><span style="color:#86888b">Itajaí, {{ dataExtenso }}</span></div>
            <div style="text-align:center">
              <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px">{{ responsavelPreview }}</div>
              <div style="border-top:1.5px solid #141515;width:194px;margin-top:3px;padding-top:5px;font-size:10.5px;letter-spacing:.1em;color:#86888b">CAPACITAR TREINAMENTOS</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</template>

<!-- Script da logica do componente. Deve estar no documento porque o
     runtime procura por <script type="text/x-dc" data-dc-script>. -->
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.LS_KEY = 'orcamento_capacitar_v2';
    this.state = {
      clienteNome: 'AC Service',
      itens: [
        { descricao: 'Reciclagem de Operador de Pá Carregadeira', qtd: '1', unitario: '490' }
      ],
    };
  }

  componentDidMount() {
    try {
      const raw = localStorage.getItem(this.LS_KEY);
      if (raw) this.setState(JSON.parse(raw));
    } catch (e) {}
  }
  componentDidUpdate() {
    try { localStorage.setItem(this.LS_KEY, JSON.stringify(this.state)); } catch (e) {}
  }

  setField = (k) => (e) => this.setState({ [k]: e.target.value });
  updateItem = (i, k) => (e) => {
    const v = e.target.value;
    this.setState((s) => ({ itens: s.itens.map((it, idx) => idx === i ? { ...it, [k]: v } : it) }));
  };
  addItem = () => this.setState((s) => ({ itens: [...s.itens, { descricao: '', qtd: '1', unitario: '0' }] }));
  removeItem = (i) => () => this.setState((s) => ({ itens: s.itens.length > 1 ? s.itens.filter((_, idx) => idx !== i) : s.itens }));
  gerarPDF = () => window.print();

  renderVals() {
    const brl = (n) => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    const hoje = new Date();
    const y = hoje.getFullYear(), m = hoje.getMonth() + 1, d = hoje.getDate();
    const dd = String(d).padStart(2, '0'), mm = String(m).padStart(2, '0');
    const dataExtenso = `${dd} de ${meses[m - 1]} de ${y}`;
    const dataCurta = `${dd}/${mm}/${y}`;

    let total = 0;
    const itensForm = [];
    const itensPreview = [];
    this.state.itens.forEach((it, i) => {
      const q = parseFloat(it.qtd) || 0;
      const u = parseFloat(it.unitario) || 0;
      const sub = q * u;
      total += sub;
      const num = String(i + 1).padStart(2, '0');
      itensForm.push({
        num,
        descricao: it.descricao,
        qtd: it.qtd,
        unitario: it.unitario,
        subFmt: brl(sub),
        onDesc: this.updateItem(i, 'descricao'),
        onQtd: this.updateItem(i, 'qtd'),
        onUnit: this.updateItem(i, 'unitario'),
        onRemove: this.removeItem(i),
      });
      itensPreview.push({
        num,
        qtd: String(Math.round(q)).padStart(2, '0'),
        descricao: (it.descricao || '—').toUpperCase(),
        unitFmt: brl(u),
        totalFmt: brl(sub),
      });
    });

    const diferenciais = [
      'Certificação única com Reconhecimento Mercosul, CAP – Conselho de Autoridade Portuária e Decreto Marinha nº 180.',
      'Apta a atender a área portuária, com registro no Ministério do Trabalho.',
      'Logotipo da empresa impresso no verso da carteirinha, sem custo adicional.'
    ];

    const R = (window.__resources || {});
    const parcerias = [
      { nome: 'OCEANIC', img: R.oceanic || 'assets/parceiro-oceanic.png' },
      { nome: 'BRASMAQ Portuária', img: R.brasmaq || 'assets/parceiro-2.svg' }
    ];

    return {
      clienteNome: this.state.clienteNome,
      onCliente: this.setField('clienteNome'),
      itensForm,
      addItem: this.addItem,
      gerarPDF: this.gerarPDF,
      clienteNomePreview: this.state.clienteNome || '—',
      responsavelPreview: 'Renato',
      itens: itensPreview,
      diferenciais,
      parcerias,
      totalFmt: brl(total),
      dataCurta,
      dataExtenso,
    };
  }
}
</script>

<!-- Boot: move o template para fora antes do runtime tentar montar. -->
<script src="./assets/js/boot.js"></script>

<!-- Logica de responsividade no celular + botao flutuante "GERAR PDF" -->
<script src="./assets/js/mobile.js"></script>

</body>
</html>
